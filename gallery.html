  <style>
    #site-header {
      background-color: rgba(255, 255, 255, 0.96) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
    }
    .gallery-hero-header {
      padding-top: 108px;
      padding-bottom: 24px;
      background: linear-gradient(180deg, rgba(14, 165, 233, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
      position: relative;
    }
    .gallery-hero-container {
      max-width: 1760px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    @media (min-width: 640px) {
      .gallery-hero-container {
        padding: 0 28px;
      }
    }
    .gallery-hero-header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2rem, 3.8vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1a2332;
      margin: 0;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .gallery-blue-bar {
      height: 2px;
      flex: 1;
      background: linear-gradient(90deg, #0ea5e9 0%, rgba(14, 165, 233, 0.25) 50%, rgba(14, 165, 233, 0) 100%);
      border-radius: 2px;
      margin-bottom: 4px;
    }
    .gallery-wrapper {
      max-width: 1760px;
      margin: 0 auto;
      padding: 0 20px 48px 20px;
    }
    @media (min-width: 640px) {
      .gallery-wrapper {
        padding: 0 28px 56px 28px;
      }
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .gallery-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
    }
    @media (min-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
    }
    @media (min-width: 1440px) {
      .gallery-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
    }
    @media (min-width: 1920px) {
      .gallery-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
      }
    }
    .gallery-item {
      aspect-ratio: 4 / 3;
      border-radius: 8px;
    }
    @media (min-width: 768px) {
      .gallery-item.span-2 {
        grid-column: span 2;
        aspect-ratio: 16 / 9;
      }
    }
  </style>

  <!-- ===== MINIMALIST LIGHTBOX MODAL (NO TEXT) ===== -->
  <div id="lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-deep/95 backdrop-blur-md opacity-0 transition-opacity duration-300">
    <button id="lightbox-close" class="absolute top-6 right-6 z-10 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white transition-all hover:bg-white/20" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
    <button id="lightbox-prev" class="absolute left-4 z-10 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white transition-all hover:bg-white/20" aria-label="Previous">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button id="lightbox-next" class="absolute right-4 z-10 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white transition-all hover:bg-white/20" aria-label="Next">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div id="lightbox-content" class="relative max-h-[90vh] max-w-[92vw] overflow-hidden flex items-center justify-center">
      <img id="lightbox-img" src="" alt="" class="hidden max-h-[88vh] max-w-[90vw] object-contain rounded-lg shadow-2xl">
      <video id="lightbox-video" controls class="hidden max-h-[88vh] max-w-[90vw] rounded-lg shadow-2xl" playsinline></video>
    </div>
  </div>

  <script>
    // Mobile navigation toggle
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const openIcon = document.getElementById('menu-icon-open');
    const closeIcon = document.getElementById('menu-icon-close');

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener('click', () => {
        const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
        menuToggle.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.classList.toggle('hidden');
        openIcon.classList.toggle('hidden');
        closeIcon.classList.toggle('hidden');
      });
    }

    // Pure visual Lightbox
    const items = Array.from(document.querySelectorAll('.gallery-item'));
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');
    const closeBtn = document.getElementById('lightbox-close');
    const prevBtn = document.getElementById('lightbox-prev');
    const nextBtn = document.getElementById('lightbox-next');
    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      const item = items[currentIndex];
      const type = item.getAttribute('data-type');
      const src = item.getAttribute('data-src');

      if (type === 'video') {
        lightboxImg.classList.add('hidden');
        lightboxVideo.classList.remove('hidden');
        lightboxVideo.src = src;
        const poster = item.getAttribute('data-poster');
        if (poster) lightboxVideo.poster = poster;
        lightboxVideo.play().catch(() => {});
      } else {
        lightboxVideo.pause();
        lightboxVideo.classList.add('hidden');
        lightboxVideo.src = '';
        lightboxImg.classList.remove('hidden');
        lightboxImg.src = src;
      }

      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
      setTimeout(() => {
        lightbox.classList.remove('opacity-0');
        lightbox.classList.add('opacity-100');
      }, 10);
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('opacity-100');
      lightbox.classList.add('opacity-0');
      lightboxVideo.pause();
      lightboxVideo.src = '';
      setTimeout(() => {
        lightbox.classList.remove('flex');
        lightbox.classList.add('hidden');
        document.body.style.overflow = '';
      }, 300);
    }

    function showNext() {
      const nextIdx = (currentIndex + 1) % items.length;
      openLightbox(nextIdx);
    }

    function showPrev() {
      const prevIdx = (currentIndex - 1 + items.length) % items.length;
      openLightbox(prevIdx);
    }

    items.forEach((item, index) => {
      item.addEventListener('click', () => openLightbox(index));
    });

    closeBtn.addEventListener('click', closeLightbox);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.id === 'lightbox-content') {
        closeLightbox();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
    });
  </script>
